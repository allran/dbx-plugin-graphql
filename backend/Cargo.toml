[package]
name = "dbx-plugin-graphql"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[dependencies]
dbx-plugin-sdk = { version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
